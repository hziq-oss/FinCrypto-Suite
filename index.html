<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinCrypto Suite - Kalkulator</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: #161e2e;
            --bg-input: #0f172a;
            --border-color: #243044;
            --border-sub: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #64748b;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
        }

        body.light-mode {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --border-color: #cbd5e1;
            --border-sub: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --text-muted: #475569;
            --accent: #0284c7;
            --accent-hover: #0369a1;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        
        .container { background: var(--bg-card); border: 1px solid var(--border-color); width: 100%; max-width: 520px; border-radius: 20px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        
        /* Header Tanpa Pertindihan */
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; position: relative; }
        .header-spacer { width: 36px; }
        .header-title-group { text-align: center; flex: 1; }
        .header h1 { font-size: 20px; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; line-height: 1.2; }
        .header p { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

        .theme-toggle-btn { width: 36px; height: 36px; background: var(--bg-input); border: 1px solid var(--border-sub); color: var(--text-main); border-radius: 10px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, transform 0.1s; flex-shrink: 0; }
        .theme-toggle-btn:active { transform: scale(0.92); }

        .nav-tabs { display: flex; background: var(--bg-input); border-radius: 10px; border: 1px solid var(--border-sub); padding: 4px; margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-weight: bold; font-size: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; text-align: center; text-decoration: none; }
        .tab-btn.active { background: var(--accent); color: #0b0f19; }

        /* Numpad & Layout Display Kalkulator Asal */
        .display-screen { background: var(--bg-input); border: 1px solid var(--border-sub); border-radius: 14px; padding: 16px; margin-bottom: 16px; text-align: right; }
        .screen-label { font-size: 11px; color: var(--text-sub); font-weight: bold; text-transform: uppercase; text-align: left; margin-bottom: 4px; }
        .screen-value { font-size: 28px; font-weight: bold; color: var(--accent); font-family: monospace; word-break: break-all; }
        .screen-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        .input-selection { display: flex; gap: 8px; margin-bottom: 16px; }
        .field-btn { flex: 1; padding: 10px; background: var(--bg-input); border: 1px solid var(--border-sub); color: var(--text-muted); border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
        .field-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(56, 189, 248, 0.1); }

        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .num-btn { background: var(--bg-input); border: 1px solid var(--border-sub); color: var(--text-main); font-size: 18px; font-weight: bold; padding: 16px; border-radius: 12px; cursor: pointer; transition: 0.1s; }
        .num-btn:active { background: var(--border-sub); transform: scale(0.96); }
        .num-btn.action { color: #f87171; }
        .num-btn.confirm { background: var(--accent); color: #0b0f19; grid-column: span 2; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-spacer"></div>
        <div class="header-title-group">
            <h1>FinCrypto Suite</h1>
            <p>Kalkulator Anggaran Koin</p>
        </div>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn" title="Tukar Mod Tema">☀️</button>
    </div>

    <div class="nav-tabs">
        <a href="index.html" class="tab-btn active">Kalkulator</a>
        <a href="portfolio.html" class="tab-btn">Portfolio Saya</a>
        <a href="info.html" class="tab-btn">Info Pasaran</a>
    </div>

    <div class="display-screen">
        <div class="screen-label" id="activeFieldLabel">Modal (MYR)</div>
        <div class="screen-value" id="activeFieldValue">0</div>
        <div class="screen-sub" id="calcSummarySub">Hasil: 0.00 Koin (Modal: $0.00 USD)</div>
    </div>

    <div class="input-selection">
        <button class="field-btn active" id="btnFieldMYR" onclick="selectField('MYR')">Modal (MYR)</button>
        <button class="field-btn" id="btnFieldRate" onclick="selectField('RATE')">Kadar USD/MYR</button>
        <button class="field-btn" id="btnFieldTarget" onclick="selectField('TARGET')">Harga Koin ($)</button>
    </div>

    <div class="numpad">
        <button class="num-btn" onclick="appendNum('7')">7</button>
        <button class="num-btn" onclick="appendNum('8')">8</button>
        <button class="num-btn" onclick="appendNum('9')">9</button>
        <button class="num-btn" onclick="appendNum('4')">4</button>
        <button class="num-btn" onclick="appendNum('5')">5</button>
        <button class="num-btn" onclick="appendNum('6')">6</button>
        <button class="num-btn" onclick="appendNum('1')">1</button>
        <button class="num-btn" onclick="appendNum('2')">2</button>
        <button class="num-btn" onclick="appendNum('3')">3</button>
        <button class="num-btn" onclick="appendNum('.')">.</button>
        <button class="num-btn" onclick="appendNum('0')">0</button>
        <button class="num-btn action" onclick="clearActive()">C</button>
        <button class="num-btn action" onclick="backspace()">⌫</button>
        <button class="num-btn confirm" onclick="nextField()">Seterusnya ➔</button>
    </div>
</div>

<script>
let activeField = 'MYR';
let inputs = {
    MYR: '1000',
    RATE: '4.45',
    TARGET: '0.50'
};

function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    document.getElementById('themeBtn').innerText = isLight ? '🌙' : '☀️';
    localStorage.setItem('themePreference', isLight ? 'light' : 'dark');
}

if (localStorage.getItem('themePreference') === 'light') {
    document.body.classList.add('light-mode');
    document.getElementById('themeBtn').innerText = '🌙';
}

function updateDisplay() {
    document.getElementById('activeFieldValue').innerText = inputs[activeField] || '0';
    
    const myr = parseFloat(inputs.MYR) || 0;
    const rate = parseFloat(inputs.RATE) || 4.45;
    const target = parseFloat(inputs.TARGET) || 0;

    const usd = myr / rate;
    const coins = target > 0 ? (usd / target) : 0;

    document.getElementById('calcSummarySub').innerText = 
        `Hasil: ${coins.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4})} Koin (Modal: $${usd.toFixed(2)} USD)`;
}

function selectField(field) {
    activeField = field;
    document.querySelectorAll('.field-btn').forEach(btn => btn.classList.remove('active'));
    
    if (field === 'MYR') {
        document.getElementById('btnFieldMYR').classList.add('active');
        document.getElementById('activeFieldLabel').innerText = 'Modal (MYR)';
    } else if (field === 'RATE') {
        document.getElementById('btnFieldRate').classList.add('active');
        document.getElementById('activeFieldLabel').innerText = 'Kadar Pertukaran USD/MYR';
    } else if (field === 'TARGET') {
        document.getElementById('btnFieldTarget').classList.add('active');
        document.getElementById('activeFieldLabel').innerText = 'Harga Sasaran Koin (USD)';
    }
    updateDisplay();
}

function appendNum(num) {
    if (inputs[activeField] === '0' && num !== '.') {
        inputs[activeField] = num;
    } else {
        if (num === '.' && inputs[activeField].includes('.')) return;
        inputs[activeField] += num;
    }
    updateDisplay();
}

function clearActive() {
    inputs[activeField] = '0';
    updateDisplay();
}

function backspace() {
    let str = inputs[activeField];
    if (str.length > 1) {
        inputs[activeField] = str.slice(0, -1);
    } else {
        inputs[activeField] = '0';
    }
    updateDisplay();
}

function nextField() {
    if (activeField === 'MYR') selectField('RATE');
    else if (activeField === 'RATE') selectField('TARGET');
    else if (activeField === 'TARGET') selectField('MYR');
}

async function fetchExchangeRate() {
    try {
        const res = await fetch('https://open.er-api.com/v6/latest/USD');
        if (res.ok) {
            const data = await res.json();
            if (data?.rates?.MYR) {
                inputs.RATE = data.rates.MYR.toFixed(2);
                updateDisplay();
            }
        }
    } catch (e) {}
}

fetchExchangeRate();
updateDisplay();

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
