<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinCrypto Suite</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #f8fafc; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .container { background: #161e2e; border: 1px solid #243044; width: 100%; max-width: 520px; border-radius: 20px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        
        .header { text-align: center; margin-bottom: 16px; }
        .header h1 { font-size: 22px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1.5px; }
        .header p { font-size: 12px; color: #64748b; margin-top: 4px; }
        
        .status-bar { display: flex; justify-content: space-between; font-size: 11px; background: #0f172a; padding: 8px 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #1e293b; color: #94a3b8; }
        .status-dot { height: 8px; width: 8px; background-color: #22c55e; border-radius: 50%; display: inline-block; margin-right: 5px; }
        
        .input-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 20px; }
        .form-group { margin-bottom: 12px; }
        .form-group:last-child { margin-bottom: 0; }
        label { display: block; font-size: 11px; color: #64748b; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        
        input[type="number"], select { width: 100%; background: #161e2e; border: 1px solid #243044; color: #fff; padding: 12px; border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s; }
        input[type="number"]:focus, select:focus { border-color: #38bdf8; }

        .section-title { font-size: 13px; font-weight: bold; color: #94a3b8; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; }
        .badge { background: #0284c7; color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 12px; }

        /* Crypto List Card */
        .crypto-list { display: flex; flex-direction: column; gap: 10px; }
        .crypto-item { background: #0f172a; border: 1px solid #1e293b; padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; transition: transform 0.2s; }
        .crypto-item:hover { transform: translateY(-2px); border-color: #38bdf8; }
        
        .crypto-info { display: flex; flex-direction: column; }
        .crypto-pair { font-size: 15px; font-weight: bold; color: #f8fafc; }
        .crypto-rate { font-size: 11px; color: #64748b; margin-top: 3px; }

        .crypto-value { text-align: right; }
        .converted-amount { font-size: 15px; font-weight: bold; color: #4ade80; font-family: monospace; }
        .fiat-value { font-size: 11px; color: #38bdf8; font-weight: 600; margin-top: 3px; }

        .status-msg { text-align: center; color: #64748b; font-size: 13px; margin: 20px 0; }
        .btn-refresh { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
        .btn-refresh:hover { background: #0369a1; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>FinCrypto Suite</h1>
        <p>Senarai Tukaran Kripto (Paling Berbaloi → Terendah)</p>
    </div>

    <div class="status-bar">
        <div><span class="status-dot"></span> Status: <span id="syncStatus">Memuatkan data...</span></div>
        <div>USD/MYR: <span id="myrRateDisplay">RM --</span></div>
    </div>

    <!-- Ruang Input Utama -->
    <div class="input-card">
        <div class="form-group">
            <label>Daripada (Base Crypto)</label>
            <select id="baseCoin" onchange="kiraTukaran()"></select>
        </div>
        <div class="form-group">
            <label>Jumlah Kuantiti</label>
            <input type="number" id="coinAmount" value="100" min="0.000001" step="any" oninput="kiraTukaran()">
        </div>
    </div>

    <!-- Senarai Hasil Penukaran -->
    <div class="section-title">
        <span>Hasil Penukaran</span>
        <span class="badge">Disusun Mengikut Nilai</span>
    </div>

    <div class="crypto-list" id="cryptoResultList">
        <div class="status-msg">Mengambil data harga pasaran semasa...</div>
    </div>

    <button class="btn-refresh" onclick="fetchMarketData()">Kemaskini Harga</button>
</div>

<script>
const coinsList = [
    { symbol: 'ADA', name: 'Cardano', geckoId: 'cardano' },
    { symbol: 'POL', name: 'Polygon', geckoId: 'polygon-ecosystem-token' },
    { symbol: 'BTC', name: 'Bitcoin', geckoId: 'bitcoin' },
    { symbol: 'ETH', name: 'Ethereum', geckoId: 'ethereum' },
    { symbol: 'XRP', name: 'Ripple', geckoId: 'ripple' },
    { symbol: 'SOL', name: 'Solana', geckoId: 'solana' },
    { symbol: 'DOT', name: 'Polkadot', geckoId: 'polkadot' },
    { symbol: 'UNI', name: 'Uniswap', geckoId: 'uniswap' },
    { symbol: 'LTC', name: 'Litecoin', geckoId: 'litecoin' },
    { symbol: 'BCH', name: 'Bitcoin Cash', geckoId: 'bitcoin-cash' }
];

let cryptoPricesUSD = {};
let usdToMyr = 4.45; 

function initDropdown() {
    const baseSelect = document.getElementById('baseCoin');
    baseSelect.innerHTML = '';
    
    coinsList.forEach((coin) => {
        const isDefault = coin.symbol === 'ADA';
        baseSelect.add(new Option(`${coin.symbol} - ${coin.name}`, coin.symbol, isDefault, isDefault));
    });
}

async function fetchMarketData() {
    const syncEl = document.getElementById('syncStatus');
    const resultList = document.getElementById('cryptoResultList');
    syncEl.innerText = 'Mengemas kini...';

    // 1. Ambil kadar tukaran USD ke MYR
    try {
        const myrRes = await fetch('https://open.er-api.com/v6/latest/USD');
        const myrData = await myrRes.json();
        if (myrData && myrData.rates && myrData.rates.MYR) {
            usdToMyr = myrData.rates.MYR;
            document.getElementById('myrRateDisplay').innerText = `RM ${usdToMyr.toFixed(2)}`;
        }
    } catch (e) {
        document.getElementById('myrRateDisplay').innerText = `RM ${usdToMyr.toFixed(2)}`;
    }

    // 2. Ambil harga Kripto dari CoinGecko
    try {
        const ids = coinsList.map(c => c.geckoId).join(',');
        const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`);
        
        if (!res.ok) throw new Error('Ralat API');
        const data = await res.json();

        coinsList.forEach(coin => {
            if (data[coin.geckoId]) {
                cryptoPricesUSD[coin.symbol] = data[coin.geckoId].usd;
            }
        });

        syncEl.innerText = 'Dikemas kini';
        kiraTukaran();
    } catch (err) {
        console.error(err);
        syncEl.innerText = 'Ralat API';
        resultList.innerHTML = '<div class="status-msg" style="color:#f87171;">Gagal memuatkan harga. Sila cuba lagi.</div>';
    }
}

function kiraTukaran() {
    const baseSymbol = document.getElementById('baseCoin').value;
    const amount = parseFloat(document.getElementById('coinAmount').value) || 0;
    const resultList = document.getElementById('cryptoResultList');

    if (!cryptoPricesUSD[baseSymbol]) return;

    const basePriceUSD = cryptoPricesUSD[baseSymbol];
    const totalUSD = amount * basePriceUSD;
    const totalMYR = totalUSD * usdToMyr;

    let results = [];

    // Kira kadar dan jumlah tukaran ke semua token lain
    coinsList.forEach(coin => {
        if (coin.symbol !== baseSymbol) {
            const targetPriceUSD = cryptoPricesUSD[coin.symbol] || 0;
            const convertedAmount = targetPriceUSD > 0 ? (totalUSD / targetPriceUSD) : 0;
            const rate = targetPriceUSD > 0 ? (basePriceUSD / targetPriceUSD) : 0;

            results.push({
                symbol: coin.symbol,
                name: coin.name,
                convertedAmount: convertedAmount,
                rate: rate
            });
        }
    });

    // Susun daripada kuantiti hasil terbanyak ke terendah
    results.sort((a, b) => b.convertedAmount - a.convertedAmount);

    resultList.innerHTML = '';

    results.forEach(item => {
        const itemHTML = `
            <div class="crypto-item">
                <div class="crypto-info">
                    <div class="crypto-pair">${baseSymbol} → ${item.symbol}</div>
                    <div class="crypto-rate">1 ${baseSymbol} = ${item.rate.toFixed(6)} ${item.symbol}</div>
                </div>
                <div class="crypto-value">
                    <div class="converted-amount">${item.convertedAmount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 6})} ${item.symbol}</div>
                    <div class="fiat-value">≈ $${totalUSD.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} USD / RM ${totalMYR.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                </div>
            </div>
        `;
        resultList.innerHTML += itemHTML;
    });
}

initDropdown();
fetchMarketData();
setInterval(fetchMarketData, 30000);

// PWA Service Worker Registration
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
    });
}
</script>

</body>
</html>
