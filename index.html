<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinCrypto Suite - Kalkulator</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: #161e2e;
            --bg-input: #0f172a;
            --border-color: #243044;
            --border-sub: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #64748b;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
        }

        body.light-mode {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --border-color: #cbd5e1;
            --border-sub: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --text-muted: #475569;
            --accent: #0284c7;
            --accent-hover: #0369a1;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        
        .container { background: var(--bg-card); border: 1px solid var(--border-color); width: 100%; max-width: 520px; border-radius: 20px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        
        /* Header Tanpa Pertindihan */
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; position: relative; }
        .header-spacer { width: 36px; }
        .header-title-group { text-align: center; flex: 1; }
        .header h1 { font-size: 20px; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; line-height: 1.2; }
        .header p { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

        .theme-toggle-btn { width: 36px; height: 36px; background: var(--bg-input); border: 1px solid var(--border-sub); color: var(--text-main); border-radius: 10px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, transform 0.1s; flex-shrink: 0; }
        .theme-toggle-btn:active { transform: scale(0.92); }

        .nav-tabs { display: flex; background: var(--bg-input); border-radius: 10px; border: 1px solid var(--border-sub); padding: 4px; margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-weight: bold; font-size: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; text-align: center; text-decoration: none; }
        .tab-btn.active { background: var(--accent); color: #0b0f19; }

        .input-card { background: var(--bg-input); border: 1px solid var(--border-sub); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; color: var(--text-sub); font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        
        input[type="number"], select { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 15px; outline: none; }
        
        .result-card { background: linear-gradient(135deg, var(--bg-input), var(--bg-card)); border: 1px solid var(--border-color); border-radius: 14px; padding: 18px; text-align: center; }
        .result-label { font-size: 11px; text-transform: uppercase; color: var(--text-sub); font-weight: bold; }
        .result-value { font-size: 24px; font-weight: bold; color: var(--accent); font-family: monospace; margin: 6px 0; }
        .result-sub { font-size: 13px; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-spacer"></div>
        <div class="header-title-group">
            <h1>FinCrypto Suite</h1>
            <p>Kalkulator Anggaran Koin</p>
        </div>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn" title="Tukar Mod Tema">☀️</button>
    </div>

    <div class="nav-tabs">
        <a href="index.html" class="tab-btn active">Kalkulator</a>
        <a href="portfolio.html" class="tab-btn">Portfolio Saya</a>
        <a href="info.html" class="tab-btn">Info Pasaran</a>
    </div>

    <div class="input-card">
        <div class="form-group">
            <label>Jumlah Modal (MYR)</label>
            <input type="number" id="capitalMYR" placeholder="Contoh: 1000" oninput="calculate()">
        </div>
        <div class="form-group">
            <label>Kadar Pertukaran USD/MYR</label>
            <input type="number" id="exchangeRate" placeholder="4.45" value="4.45" step="0.01" oninput="calculate()">
        </div>
        <div class="form-group">
            <label>Harga Sasaran Koin (USD)</label>
            <input type="number" id="targetPriceUSD" placeholder="Contoh: 0.50" step="any" oninput="calculate()">
        </div>
    </div>

    <div class="result-card">
        <div class="result-label">Anggaran Koin Yang Diperolehi</div>
        <div class="result-value" id="coinResult">0.00</div>
        <div class="result-sub" id="usdCapitalSub">Modal USD: $0.00 USD</div>
    </div>
</div>

<script>
function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    document.getElementById('themeBtn').innerText = isLight ? '🌙' : '☀️';
    localStorage.setItem('themePreference', isLight ? 'light' : 'dark');
}

if (localStorage.getItem('themePreference') === 'light') {
    document.body.classList.add('light-mode');
    document.getElementById('themeBtn').innerText = '🌙';
}

async function fetchExchangeRate() {
    try {
        const res = await fetch('https://open.er-api.com/v6/latest/USD');
        if (res.ok) {
            const data = await res.json();
            if (data?.rates?.MYR) {
                document.getElementById('exchangeRate').value = data.rates.MYR.toFixed(2);
                calculate();
            }
        }
    } catch (e) {}
}

function calculate() {
    const myr = parseFloat(document.getElementById('capitalMYR').value) || 0;
    const rate = parseFloat(document.getElementById('exchangeRate').value) || 4.45;
    const targetPrice = parseFloat(document.getElementById('targetPriceUSD').value) || 0;

    const usdCapital = myr / rate;
    document.getElementById('usdCapitalSub').innerText = `Modal USD: $${usdCapital.toFixed(2)} USD`;

    if (targetPrice > 0 && usdCapital > 0) {
        const coins = usdCapital / targetPrice;
        document.getElementById('coinResult').innerText = coins.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4});
    } else {
        document.getElementById('coinResult').innerText = '0.00';
    }
}

fetchExchangeRate();

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
