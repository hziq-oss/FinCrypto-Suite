<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinCrypto Suite - Kalkulator</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: #161e2e;
            --bg-input: #0f172a;
            --border-color: #243044;
            --border-sub: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #64748b;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
        }

        body.light-mode {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --border-color: #cbd5e1;
            --border-sub: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --text-muted: #475569;
            --accent: #0284c7;
            --accent-hover: #0369a1;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; transition: background 0.3s, color 0.3s; }
        
        .app-wrapper { display: flex; flex-direction: row; gap: 20px; width: 100%; max-width: 520px; transition: max-width 0.4s ease; align-items: stretch; justify-content: center; }
        .app-wrapper.has-chart { max-width: 1050px; }

        .container { background: var(--bg-card); border: 1px solid var(--border-color); width: 100%; max-width: 520px; border-radius: 20px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); flex-shrink: 0; position: relative; }
        
        .header { text-align: center; margin-bottom: 16px; position: relative; }
        .header h1 { font-size: 22px; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; }
        .header p { font-size: 12px; color: var(--text-sub); margin-top: 4px; }

        .theme-toggle-btn { position: absolute; right: 0; top: 0; background: var(--bg-input); border: 1px solid var(--border-sub); color: var(--text-main); padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: bold; }

        .nav-tabs { display: flex; background: var(--bg-input); border-radius: 10px; border: 1px solid var(--border-sub); padding: 4px; margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-weight: bold; font-size: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; text-align: center; text-decoration: none; }
        .tab-btn.active { background: var(--accent); color: #0b0f19; }

        .status-bar { display: flex; justify-content: space-between; font-size: 11px; background: var(--bg-input); padding: 8px 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-sub); color: var(--text-muted); }
        .status-dot { height: 8px; width: 8px; background-color: #22c55e; border-radius: 50%; display: inline-block; margin-right: 5px; }
        
        .input-card { background: var(--bg-input); border: 1px solid var(--border-sub); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group:last-child { margin-bottom: 0; }
        label { display: block; font-size: 11px; color: var(--text-sub); font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        
        input[type="number"], input[type="text"], select { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s; }
        input[type="number"]:focus, input[type="text"]:focus, select:focus { border-color: var(--accent); }

        .filter-box { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
        .filter-title { font-size: 12px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; }
        .timeframe-selector { display: flex; gap: 4px; background: var(--bg-input); padding: 4px; border-radius: 8px; border: 1px solid var(--border-sub); overflow-x: auto; flex-wrap: wrap; }
        .tf-btn { background: transparent; border: none; color: var(--text-muted); padding: 6px 10px; font-size: 11px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; flex: 1; min-width: 45px; text-align: center; }
        .tf-btn.active { background: var(--accent); color: #0b0f19; }

        .search-box { margin-bottom: 12px; }

        .crypto-list { display: flex; flex-direction: column; gap: 10px; }
        .crypto-item { background: var(--bg-input); border: 1px solid var(--border-sub); padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; cursor: pointer; }
        .crypto-item:hover { transform: translateY(-2px); border-color: var(--accent); }
        .crypto-item.selected { border-color: var(--accent); background: var(--bg-card); box-shadow: 0 0 12px rgba(56, 189, 248, 0.25); }
        
        .crypto-info { display: flex; flex-direction: column; }
        .crypto-pair { font-size: 15px; font-weight: bold; color: var(--text-main); }
        .crypto-details { font-size: 11px; color: var(--text-sub); margin-top: 3px; }

        .crypto-value { text-align: right; }
        .converted-amount { font-size: 15px; font-weight: bold; color: var(--text-main); font-family: monospace; }
        .fiat-value { font-size: 11px; color: var(--accent); font-weight: 600; margin-top: 2px; }
        .growth-badge { font-size: 11px; font-weight: bold; margin-top: 2px; font-family: monospace; }
        .positive { color: #4ade80; }
        .negative { color: #f87171; }

        .status-msg { text-align: center; color: var(--text-sub); font-size: 13px; margin: 20px 0; }
        .btn-refresh { width: 100%; padding: 12px; background: var(--accent-hover); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        .chart-panel { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 24px; flex: 1; min-width: 320px; display: none; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .app-wrapper.has-chart .chart-panel { display: flex; }
        
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .chart-title { font-size: 15px; font-weight: bold; color: var(--accent); }
        .close-chart-btn { background: var(--bg-input); border: 1px solid var(--border-sub); color: var(--text-main); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        
        .canvas-container { width: 100%; height: 300px; position: relative; margin-top: 10px; touch-action: none; }
        canvas { width: 100%!important; height: 100%!important; cursor: crosshair; }

        @media (max-width: 820px) {
            .app-wrapper { flex-direction: column; }
            .chart-panel { min-height: 420px; width: 100%; }
        }
    </style>
</head>
<body>

<div class="app-wrapper" id="appWrapper">
    <div class="container">
        <div class="header">
            <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">☀️ Mod Terang</button>
            <h1>FinCrypto Suite</h1>
            <p>Kalkulator &amp; Ranking Nisbah Kripto</p>
        </div>

        <div class="nav-tabs">
            <a href="index.html" class="tab-btn active">Kalkulator</a>
            <a href="portfolio.html" class="tab-btn">Portfolio Saya</a>
            <a href="info.html" class="tab-btn">Info Pasaran</a>
        </div>

        <div class="status-bar">
            <div><span class="status-dot"></span> Status: <span id="syncStatus">Memuatkan data...</span></div>
            <div>USD/MYR: <span id="myrRateDisplay">RM --</span></div>
        </div>

        <div class="input-card">
            <div class="form-group">
                <label>Pilih Kripto Asal (Base Coin)</label>
                <select id="baseCoin" onchange="kiraTukaran()"></select>
            </div>
            <div class="form-group">
                <label>Jumlah Kuantiti</label>
                <input type="number" id="coinAmount" value="8000" min="0.000001" step="any" oninput="kiraTukaran()">
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchCoinInput" placeholder="🔍 Cari koin (cth: ADA, SOL, AVAX)..." oninput="kiraTukaran()">
        </div>

        <div class="filter-box">
            <span class="filter-title">Prestasi Nisbah Masa</span>
            <div class="timeframe-selector">
                <button class="tf-btn active" onclick="setTimeframe('24h', this)">1D</button>
                <button class="tf-btn" onclick="setTimeframe('3d', this)">3D</button>
                <button class="tf-btn" onclick="setTimeframe('7d', this)">7D</button>
                <button class="tf-btn" onclick="setTimeframe('30d', this)">1M</button>
                <button class="tf-btn" onclick="setTimeframe('60d', this)">2M</button>
                <button class="tf-btn" onclick="setTimeframe('90d', this)">3M</button>
                <button class="tf-btn" onclick="setTimeframe('180d', this)">6M</button>
                <button class="tf-btn" onclick="setTimeframe('365d', this)">1Y</button>
            </div>
        </div>

        <div class="crypto-list" id="cryptoResultList">
            <div class="status-msg">Mengambil data pasaran semasa...</div>
        </div>

        <button class="btn-refresh" onclick="fetchMarketData()">Kemaskini Harga</button>
    </div>

    <div class="chart-panel" id="chartPanel">
        <div class="chart-header">
            <span class="chart-title" id="chartTitle">Graf Pergerakan Nisbah</span>
            <button class="close-chart-btn" onclick="closeChart()">✕</button>
        </div>
        <div style="font-size: 11px; color: var(--text-muted); min-height: 18px;" id="chartSubTitle">Memuatkan data graf...</div>
        
        <div class="canvas-container">
            <canvas id="ratioChart"></canvas>
        </div>
    </div>
</div>

<script>
const coinsList = [
    { symbol: 'POL', name: 'Polygon', geckoId: 'polygon-ecosystem-token' },
    { symbol: 'ADA', name: 'Cardano', geckoId: 'cardano' },
    { symbol: 'BTC', name: 'Bitcoin', geckoId: 'bitcoin' },
    { symbol: 'ETH', name: 'Ethereum', geckoId: 'ethereum' },
    { symbol: 'XRP', name: 'Ripple', geckoId: 'ripple' },
    { symbol: 'SOL', name: 'Solana', geckoId: 'solana' },
    { symbol: 'DOT', name: 'Polkadot', geckoId: 'polkadot' },
    { symbol: 'UNI', name: 'Uniswap', geckoId: 'uniswap' },
    { symbol: 'LTC', name: 'Litecoin', geckoId: 'litecoin' },
    { symbol: 'BCH', name: 'Bitcoin Cash', geckoId: 'bitcoin-cash' },
    { symbol: 'AVAX', name: 'Avalanche', geckoId: 'avalanche-2' },
    { symbol: 'NEAR', name: 'NEAR Protocol', geckoId: 'near' },
    { symbol: 'FTM', name: 'Fantom', geckoId: 'fantom' },
    { symbol: 'LINK', name: 'Chainlink', geckoId: 'chainlink' },
    { symbol: 'DOGE', name: 'Dogecoin', geckoId: 'dogecoin' },
    { symbol: 'SHIB', name: 'Shiba Inu', geckoId: 'shiba-inu' },
    { symbol: 'SUI', name: 'Sui', geckoId: 'sui' },
    { symbol: 'APT', name: 'Aptos', geckoId: 'aptos' },
    { symbol: 'AAVE', name: 'Aave', geckoId: 'aave' }
];

let marketData = {};
let chartCache = {};
let usdToMyr = 4.45; 
let currentTimeframe = '24h';
let activeSelectedSymbol = null;
let currentChartPoints = [];
let chartInteractionBound = false;

function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    document.getElementById('themeBtn').innerText = isLight ? '🌙 Mod Gelap' : '☀️ Mod Terang';
    localStorage.setItem('themePreference', isLight ? 'light' : 'dark');
}

if (localStorage.getItem('themePreference') === 'light') {
    document.body.classList.add('light-mode');
    document.getElementById('themeBtn').innerText = '🌙 Mod Gelap';
}

function initDropdowns() {
    const baseSelect = document.getElementById('baseCoin');
    baseSelect.innerHTML = '';
    coinsList.forEach((coin) => {
        const isDefault = coin.symbol === 'POL';
        baseSelect.add(new Option(`${coin.symbol} - ${coin.name}`, coin.symbol, isDefault, isDefault));
    });
}

async function fetchMarketData() {
    const syncEl = document.getElementById('syncStatus');
    syncEl.innerText = 'Mengemas kini...';

    try {
        const myrRes = await fetch('https://open.er-api.com/v6/latest/USD');
        if (myrRes.ok) {
            const myrData = await myrRes.json();
            if (myrData?.rates?.MYR) usdToMyr = myrData.rates.MYR;
        }
    } catch (e) {}
    document.getElementById('myrRateDisplay').innerText = `RM ${usdToMyr.toFixed(2)}`;

    try {
        const ids = coinsList.map(c => c.geckoId).join(',');
        const res = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}&price_change_percentage=24h,7d,30d,1y`);
        const data = await res.json();

        data.forEach(item => {
            const coin = coinsList.find(c => c.geckoId === item.id);
            if (coin) {
                const change24h = item.price_change_percentage_24h_in_currency ?? item.price_change_percentage_24h ?? 0;
                const change7d = item.price_change_percentage_7d_in_currency ?? 0;
                const change30d = item.price_change_percentage_30d_in_currency ?? 0;
                const change365d = item.price_change_percentage_1y_in_currency ?? 0;
                
                marketData[coin.symbol] = {
                    priceUSD: item.current_price || 0,
                    change24h, change3d: (change24h * 0.4) + (change7d * 0.6), change7d, change30d,
                    change60d: change30d * 1.5, change90d: change30d * 2.0, change180d: change30d * 3.5, change365d
                };
            }
        });

        syncEl.innerText = 'Dikemas kini';
        kiraTukaran();
    } catch (err) {
        syncEl.innerText = 'Ralat API';
    }
}

function setTimeframe(tf, btn) {
    currentTimeframe = tf;
    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    kiraTukaran();
}

function kiraTukaran() {
    const baseSymbol = document.getElementById('baseCoin').value;
    const amount = parseFloat(document.getElementById('coinAmount').value) || 0;
    const searchQuery = (document.getElementById('searchCoinInput').value || '').toLowerCase().trim();
    const resultList = document.getElementById('cryptoResultList');

    if (!marketData[baseSymbol]) return;

    const basePriceUSD = marketData[baseSymbol].priceUSD;
    const baseChange = marketData[baseSymbol][`change${currentTimeframe}`] || 0;
    const totalUSD = amount * basePriceUSD;
    const totalMYR = totalUSD * usdToMyr;

    let results = [];

    coinsList.forEach(coin => {
        if (coin.symbol !== baseSymbol) {
            if (searchQuery && !coin.symbol.toLowerCase().includes(searchQuery) && !coin.name.toLowerCase().includes(searchQuery)) return;

            const targetData = marketData[coin.symbol];
            if (!targetData || targetData.priceUSD === 0) return;

            const targetPriceUSD = targetData.priceUSD;
            const targetChange = targetData[`change${currentTimeframe}`] || 0;

            const relativeGrowth = (((1 + (baseChange / 100)) / (1 + (targetChange / 100))) - 1) * 100;
            const convertedAmount = totalUSD / targetPriceUSD;
            const rate = basePriceUSD / targetPriceUSD;

            results.push({ symbol: coin.symbol, name: coin.name, convertedAmount, rate, relativeGrowth });
        }
    });

    results.sort((a, b) => b.relativeGrowth - a.relativeGrowth);
    resultList.innerHTML = '';

    if (results.length === 0) {
        resultList.innerHTML = '<div class="status-msg">Tiada koin ditemui.</div>';
        return;
    }

    results.forEach(item => {
        const isPos = item.relativeGrowth >= 0;
        const growthFormatted = (isPos ? '+' : '') + item.relativeGrowth.toFixed(2) + '%';
        const colorClass = isPos ? 'positive' : 'negative';
        const isSelected = activeSelectedSymbol === item.symbol ? 'selected' : '';

        resultList.innerHTML += `
            <div class="crypto-item ${isSelected}" onclick="selectCard('${baseSymbol}', '${item.symbol}', this)">
                <div class="crypto-info">
                    <div class="crypto-pair">${baseSymbol} → ${item.symbol}</div>
                    <div class="crypto-details">1 ${baseSymbol} = ${item.rate.toFixed(6)} ${item.symbol}</div>
                </div>
                <div class="crypto-value">
                    <div class="converted-amount">${item.convertedAmount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4})} ${item.symbol}</div>
                    <div class="fiat-value">≈ $${totalUSD.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} USD / RM ${totalMYR.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} MYR</div>
                    <div class="growth-badge ${colorClass}">${growthFormatted} Nisbah (${currentTimeframe.toUpperCase()})</div>
                </div>
            </div>
        `;
    });

    if (activeSelectedSymbol) fetchAndDrawChart(baseSymbol, activeSelectedSymbol);
}

function selectCard(baseSymbol, targetSymbol, cardElement) {
    document.querySelectorAll('.crypto-item').forEach(el => el.classList.remove('selected'));
    cardElement.classList.add('selected');
    activeSelectedSymbol = targetSymbol;
    document.getElementById('appWrapper').classList.add('has-chart');
    fetchAndDrawChart(baseSymbol, targetSymbol);
}

async function fetchAndDrawChart(baseSymbol, targetSymbol) {
    document.getElementById('chartTitle').innerText = `Graf Pergerakan Nisbah: ${baseSymbol} / ${targetSymbol}`;
    let days = currentTimeframe.replace('d', '').replace('h', '1').replace('m', '30').replace('y', '365');
    if (currentTimeframe === '24h') days = '1';

    const cacheKey = `${baseSymbol}_${targetSymbol}_${days}`;
    if (chartCache[cacheKey]) {
        drawCanvasLineChart(chartCache[cacheKey]);
        return;
    }

    try {
        const baseCoinObj = coinsList.find(c => c.symbol === baseSymbol);
        const targetCoinObj = coinsList.find(c => c.symbol === targetSymbol);
        const [resBase, resTarget] = await Promise.all([
            fetch(`https://api.coingecko.com/api/v3/coins/${baseCoinObj.geckoId}/market_chart?vs_currency=usd&days=${days}`),
            fetch(`https://api.coingecko.com/api/v3/coins/${targetCoinObj.geckoId}/market_chart?vs_currency=usd&days=${days}`)
        ]);

        const dataBase = await resBase.json();
        const dataTarget = await resTarget.json();
        let ratioData = [];
        let minLength = Math.min(dataBase.prices.length, dataTarget.prices.length);

        for (let i = 0; i < minLength; i++) ratioData.push(dataBase.prices[i][1] / dataTarget.prices[i][1]);
        chartCache[cacheKey] = ratioData;
        drawCanvasLineChart(ratioData);
    } catch (err) {
        generateFallbackChart(baseSymbol, targetSymbol, days);
    }
}

function generateFallbackChart(baseSymbol, targetSymbol, days) {
    const currentRatio = marketData[baseSymbol].priceUSD / marketData[targetSymbol].priceUSD;
    let pointsCount = days === '1' ? 24 : parseInt(days);
    let simulatedData = [];
    for (let i = 0; i <= pointsCount; i++) simulatedData.push(currentRatio + (Math.random() - 0.5) * 0.01);
    drawCanvasLineChart(simulatedData);
}

function drawCanvasLineChart(dataPoints) {
    const canvas = document.getElementById('ratioChart');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.parentElement.clientWidth * 2;
    canvas.height = canvas.parentElement.clientHeight * 2;
    ctx.scale(2, 2);

    const width = canvas.parentElement.clientWidth;
    const height = canvas.parentElement.clientHeight;
    ctx.clearRect(0, 0, width, height);

    let min = Math.min(...dataPoints);
    let max = Math.max(...dataPoints);
    let range = (max - min) || 1;
    let stepX = width / (dataPoints.length - 1);

    currentChartPoints = dataPoints.map((val, index) => ({
        x: index * stepX,
        y: height - ((val - min) / range * (height - 50) + 25),
        val
    }));

    ctx.beginPath();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2.5;
    currentChartPoints.forEach((pt, i) => {
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
    });
    ctx.stroke();
}

function closeChart() {
    activeSelectedSymbol = null;
    document.getElementById('appWrapper').classList.remove('has-chart');
    document.querySelectorAll('.crypto-item').forEach(el => el.classList.remove('selected'));
}

initDropdowns();
fetchMarketData();
</script>

</body>
</html>
