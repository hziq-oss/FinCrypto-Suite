<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinCrypto Suite - Performance & Value Ranking</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #f8fafc; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .container { background: #161e2e; border: 1px solid #243044; width: 100%; max-width: 520px; border-radius: 20px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        
        .header { text-align: center; margin-bottom: 16px; }
        .header h1 { font-size: 22px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1.5px; }
        .header p { font-size: 12px; color: #64748b; margin-top: 4px; }
        
        .status-bar { display: flex; justify-content: space-between; font-size: 11px; background: #0f172a; padding: 8px 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #1e293b; color: #94a3b8; }
        .status-dot { height: 8px; width: 8px; background-color: #22c55e; border-radius: 50%; display: inline-block; margin-right: 5px; }
        
        .input-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group:last-child { margin-bottom: 0; }
        label { display: block; font-size: 11px; color: #64748b; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        
        input[type="number"], select { width: 100%; background: #161e2e; border: 1px solid #243044; color: #fff; padding: 12px; border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s; }
        input[type="number"]:focus, select:focus { border-color: #38bdf8; }

        /* Timeframe Selector */
        .filter-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .filter-title { font-size: 12px; font-weight: bold; color: #94a3b8; text-transform: uppercase; }
        .timeframe-selector { display: flex; gap: 4px; background: #0f172a; padding: 4px; border-radius: 8px; border: 1px solid #1e293b; }
        .tf-btn { background: transparent; border: none; color: #94a3b8; padding: 6px 12px; font-size: 11px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .tf-btn.active { background: #38bdf8; color: #0b0f19; }

        /* List Items */
        .crypto-list { display: flex; flex-direction: column; gap: 10px; }
        .crypto-item { background: #0f172a; border: 1px solid #1e293b; padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; transition: transform 0.2s; }
        .crypto-item:hover { transform: translateY(-2px); border-color: #38bdf8; }
        
        .crypto-info { display: flex; flex-direction: column; }
        .crypto-pair { font-size: 15px; font-weight: bold; color: #f8fafc; }
        .crypto-details { font-size: 11px; color: #64748b; margin-top: 3px; }

        .crypto-value { text-align: right; }
        .converted-amount { font-size: 15px; font-weight: bold; color: #f8fafc; font-family: monospace; }
        .fiat-value { font-size: 11px; color: #38bdf8; font-weight: 600; margin-top: 2px; }
        .growth-badge { font-size: 11px; font-weight: bold; margin-top: 2px; font-family: monospace; }
        .positive { color: #4ade80; }
        .negative { color: #f87171; }

        .status-msg { text-align: center; color: #64748b; font-size: 13px; margin: 20px 0; }
        .btn-refresh { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-refresh:hover { background: #0369a1; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>FinCrypto Suite</h1>
        <p>Ranking Prestasi &amp; Penukaran Nilai Kripto</p>
    </div>

    <div class="status-bar">
        <div><span class="status-dot"></span> Status: <span id="syncStatus">Memuatkan data...</span></div>
        <div>USD/MYR: <span id="myrRateDisplay">RM --</span></div>
    </div>

    <!-- Ruang Input Utama -->
    <div class="input-card">
        <div class="form-group">
            <label>Pilih Kripto Asal (Base Coin)</label>
            <select id="baseCoin" onchange="kiraTukaran()"></select>
        </div>
        <div class="form-group">
            <label>Jumlah Kuantiti</label>
            <input type="number" id="coinAmount" value="100" min="0.000001" step="any" oninput="kiraTukaran()">
        </div>
    </div>

    <!-- Pilihan Tempoh Masa (Timeframe) -->
    <div class="filter-box">
        <span class="filter-title">Prestasi Nisbah</span>
        <div class="timeframe-selector">
            <button class="tf-btn active" onclick="setTimeframe('24h', this)">1 Hari</button>
            <button class="tf-btn" onclick="setTimeframe('3d', this)">3 Hari</button>
            <button class="tf-btn" onclick="setTimeframe('7d', this)">1 Minggu</button>
        </div>
    </div>

    <!-- Senarai Hasil Penukaran -->
    <div class="crypto-list" id="cryptoResultList">
        <div class="status-msg">Mengambil data pasaran semasa...</div>
    </div>

    <button class="btn-refresh" onclick="fetchMarketData()">Kemaskini Harga</button>
</div>

<script>
const coinsList = [
    { symbol: 'POL', name: 'Polygon', geckoId: 'polygon-ecosystem-token' },
    { symbol: 'ADA', name: 'Cardano', geckoId: 'cardano' },
    { symbol: 'BTC', name: 'Bitcoin', geckoId: 'bitcoin' },
    { symbol: 'ETH', name: 'Ethereum', geckoId: 'ethereum' },
    { symbol: 'XRP', name: 'Ripple', geckoId: 'ripple' },
    { symbol: 'SOL', name: 'Solana', geckoId: 'solana' },
    { symbol: 'DOT', name: 'Polkadot', geckoId: 'polkadot' },
    { symbol: 'UNI', name: 'Uniswap', geckoId: 'uniswap' },
    { symbol: 'LTC', name: 'Litecoin', geckoId: 'litecoin' },
    { symbol: 'BCH', name: 'Bitcoin Cash', geckoId: 'bitcoin-cash' }
];

let marketData = {};
let usdToMyr = 4.45; 
let currentTimeframe = '24h';

function initDropdown() {
    const baseSelect = document.getElementById('baseCoin');
    baseSelect.innerHTML = '';
    
    coinsList.forEach((coin) => {
        const isDefault = coin.symbol === 'POL';
        baseSelect.add(new Option(`${coin.symbol} - ${coin.name}`, coin.symbol, isDefault, isDefault));
    });
}

async function fetchMarketData() {
    const syncEl = document.getElementById('syncStatus');
    const resultList = document.getElementById('cryptoResultList');
    syncEl.innerText = 'Mengemas kini...';

    // 1. Ambil kadar USD/MYR
    try {
        const myrRes = await fetch('https://open.er-api.com/v6/latest/USD');
        if (myrRes.ok) {
            const myrData = await myrRes.json();
            if (myrData?.rates?.MYR) usdToMyr = myrData.rates.MYR;
        }
    } catch (e) {
        console.warn('Guna kadar lalai MYR:', e);
    }
    document.getElementById('myrRateDisplay').innerText = `RM ${usdToMyr.toFixed(2)}`;

    // 2. Ambil data harga & % perubahan dari CoinGecko
    try {
        const ids = coinsList.map(c => c.geckoId).join(',');
        const res = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}&price_change_percentage=24h,7d`);
        
        if (!res.ok) throw new Error('Ralat API CoinGecko');
        const data = await res.json();

        data.forEach(item => {
            const coin = coinsList.find(c => c.geckoId === item.id);
            if (coin) {
                const change24h = item.price_change_percentage_24h_in_currency ?? item.price_change_percentage_24h ?? 0;
                const change7d = item.price_change_percentage_7d_in_currency ?? 0;
                const change3d = (change24h * 0.4) + (change7d * 0.6);

                marketData[coin.symbol] = {
                    priceUSD: item.current_price || 0,
                    change24h: change24h,
                    change3d: change3d,
                    change7d: change7d
                };
            }
        });

        syncEl.innerText = 'Dikemas kini';
        kiraTukaran();
    } catch (err) {
        console.error(err);
        syncEl.innerText = 'Ralat API';
        resultList.innerHTML = '<div class="status-msg" style="color:#f87171;">Gagal mengambil data pasaran. Cuba sebentar lagi.</div>';
    }
}

function setTimeframe(tf, btn) {
    currentTimeframe = tf;
    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    kiraTukaran();
}

function kiraTukaran() {
    const baseSymbol = document.getElementById('baseCoin').value;
    const amount = parseFloat(document.getElementById('coinAmount').value) || 0;
    const resultList = document.getElementById('cryptoResultList');

    if (!marketData[baseSymbol]) return;

    const basePriceUSD = marketData[baseSymbol].priceUSD;
    const baseChange = marketData[baseSymbol][`change${currentTimeframe}`];
    const totalUSD = amount * basePriceUSD;
    const totalMYR = totalUSD * usdToMyr;

    let results = [];

    coinsList.forEach(coin => {
        if (coin.symbol !== baseSymbol) {
            const targetData = marketData[coin.symbol];
            if (!targetData || targetData.priceUSD === 0) return;

            const targetPriceUSD = targetData.priceUSD;
            const targetChange = targetData[`change${currentTimeframe}`];

            // Formula Pertumbuhan Pertukaran Nisbah (%):
            const relativeGrowth = (((1 + (baseChange / 100)) / (1 + (targetChange / 100))) - 1) * 100;
            
            const convertedAmount = totalUSD / targetPriceUSD;
            const rate = basePriceUSD / targetPriceUSD;

            results.push({
                symbol: coin.symbol,
                name: coin.name,
                convertedAmount: convertedAmount,
                rate: rate,
                relativeGrowth: relativeGrowth
            });
        }
    });

    // Susun mengikut Keuntungan Pertumbuhan Nisbah (%) terbanyak di atas
    results.sort((a, b) => b.relativeGrowth - a.relativeGrowth);

    resultList.innerHTML = '';

    results.forEach(item => {
        const isPos = item.relativeGrowth >= 0;
        const growthFormatted = (isPos ? '+' : '') + item.relativeGrowth.toFixed(2) + '%';
        const colorClass = isPos ? 'positive' : 'negative';

        const itemHTML = `
            <div class="crypto-item">
                <div class="crypto-info">
                    <div class="crypto-pair">${baseSymbol} → ${item.symbol}</div>
                    <div class="crypto-details">1 ${baseSymbol} = ${item.rate.toFixed(6)} ${item.symbol}</div>
                </div>
                <div class="crypto-value">
                    <div class="converted-amount">${item.convertedAmount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4})} ${item.symbol}</div>
                    <div class="fiat-value">≈ $${totalUSD.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} USD / RM ${totalMYR.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                    <div class="growth-badge ${colorClass}">${growthFormatted} Nisbah (${currentTimeframe.toUpperCase()})</div>
                </div>
            </div>
        `;
        resultList.innerHTML += itemHTML;
    });
}

initDropdown();
fetchMarketData();
setInterval(fetchMarketData, 60000);

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
    });
}
</script>

</body>
</html>
